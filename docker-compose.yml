services:
  postgres:
    image: postgres:18.6
    container_name: cxj-blog-postgres
    restart: unless-stopped
    ports:
      # Windows host uses 5433 because the locally installed PostgreSQL uses 5432.
      - "5433:5432"
    env_file:
      - ./.env
    environment:
      TZ: Asia/Shanghai
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - blog-network

volumes:
  postgres_data:

networks:
  blog-network:
    name: cxj-blog-network
