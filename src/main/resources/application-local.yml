# Do not reuse production DB_URL or feature flags in local development.
spring:
  datasource:
    url: ${LOCAL_DB_URL:jdbc:postgresql://localhost:5433/cxj_blog}
    username: ${LOCAL_DB_USERNAME:cxj_blog}
    password: ${LOCAL_DB_PASSWORD:${POSTGRES_PASSWORD:}}
server:
  address: 127.0.0.1
  port: ${LOCAL_SERVER_PORT:8080}
app:
  auth:
    cookie-secure: false
    email-enabled: false
  integrations:
    geetest-enabled: false
    cos-enabled: false
    baidu-analytics-enabled: false
  cors-origins: http://localhost:5173,http://127.0.0.1:5173
