spring:
  profiles:
    default: local
  # Docker Compose and IntelliJ can share this module's .env file. It is optional so CI uses its injected variables.
  config:
    import: optional:file:.env[.properties]
  application:
    name: cxj-blog-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/cxj_blog}
    username: ${DB_USERNAME:cxj_blog}
    password: ${DB_PASSWORD:${POSTGRES_PASSWORD:}}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
server:
  port: ${SERVER_PORT:8080}
management:
  endpoints.web.exposure.include: health,info
springdoc:
  swagger-ui.path: /swagger-ui.html
app:
  cos:
    secret-id: ${COS_SECRET_ID:}
    secret-key: ${COS_SECRET_KEY:}
    region: ${COS_REGION:ap-nanjing}
    bucket: ${COS_BUCKET:}
    public-base-url: ${COS_PUBLIC_BASE_URL:}
  geetest:
    captcha-id: ${GEETEST_CAPTCHA_ID:}
    captcha-key: ${GEETEST_CAPTCHA_KEY:}
  auth:
    email-enabled: ${AUTH_EMAIL_ENABLED:false}
    code-secret: ${AUTH_CODE_SECRET:}
    mail-from: ${MAIL_FROM:}
    ses:
      secret-id: ${TENCENTCLOUD_SECRET_ID:}
      secret-key: ${TENCENTCLOUD_SECRET_KEY:}
      region: ${SES_REGION:ap-hongkong}
      template-id: ${SES_TEMPLATE_ID:219249}
  cors-origins: ${CORS_ORIGINS:http://localhost:5173}
  integrations:
    geetest-enabled: ${GEETEST_ENABLED:false}
    cos-enabled: ${COS_ENABLED:false}
    baidu-analytics-enabled: ${BAIDU_ANALYTICS_ENABLED:false}
